services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hookflow
      POSTGRES_USER: hook
      POSTGRES_PASSWORD: hookflow
    ports: ["5433:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
  