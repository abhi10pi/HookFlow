# noinspection SpringBootApplicationYaml
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars-long}
    expiration-minutes: 60
  webhook:
    allow-private-addresses: ${WEBHOOK_ALLOW_PRIVATE_ADDRESSES:true}
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/hookflow
    username: hook
    password: hookflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 5s
    publisher-confirm-type: correlated
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        prefetch: 10
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

