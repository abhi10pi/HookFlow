# noinspection SpringBootApplicationYaml
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars-long}
    expiration-minutes: 60

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/hookflow
    username: hook
    password: hookflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health,info

